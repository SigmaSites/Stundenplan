<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vergangene Stundenpläne</title>
    <style>
        :root {            
            --red: #ef4444;
            --red-dark: #b91c1c;
            --red-text: #330a0a;
            --yellow: #eab308;
            --yellow-dark: #a16207;
            --yellow-text: #2d2003;
            --orange: #f97316;
            --orange-dark: #c2410c;
            --orange-text: #331304;
            --green: #4ade80;
            --green-dark: #34c073;
            --green-text: #10331e;
            --blue: #38bdf8;
            --blue-dark: #1fa8e0;
            --blue-text: #072a3a;
            --purple: #612A6F;
            --purple-dark: #451c4f;
            --purple-text: #ffffff;
            --bg-start: #1f2a3d;
            --bg-end: #121a2b;
            --card-bg: #192338;
            --text: #f1f6fc;
            --muted: #93a4bd;
            --border: #2c3c58;
            --error-bg: #3a0d0d;
            --error-text: #f87171;
            --success-bg: #10331e;
            --success-text: #4ade80;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h2 {
            font-size: 1.3rem;
            margin: 0 0 20px;
            letter-spacing: 0.5px;
            color: var(--text);
        }

        .downloads { display: flex; flex-direction: column; gap: 10px; }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, opacity 0.15s ease;
        }
        button:active:not(:disabled) { transform: scale(0.96); }
        button:disabled { cursor: not-allowed; opacity: 0.7; }
        button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

        /*Rot*/
        button[data-color="red"] { background: var(--red); color: var(--red-text); }
        button[data-color="red"]:hover:not(:disabled) { background: var(--red-dark); }   
        /*Orange*/
        button[data-color="orange"] { background: var(--orange); color: var(--orange-text); }
        button[data-color="orange"]:hover:not(:disabled) { background: var(--orange-dark); }   
        /*Gelb*/
        button[data-color="yellow"] { background: var(--yellow); color: var(--yellow-text); }
        button[data-color="yellow"]:hover:not(:disabled) { background: var(--yellow-dark); }
        /*Grün*/
        button[data-color="green"] { background: var(--green); color: var(--green-text); }
        button[data-color="green"]:hover:not(:disabled) { background: var(--green-dark); }
        /*Blau*/
        button[data-color="blue"] { background: var(--blue); color: var(--blue-text); }
        button[data-color="blue"]:hover:not(:disabled) { background: var(--blue-dark); }
        /*Lila*/
        button[data-color="purple"] { background: var(--purple); color: var(--purple-text); }
        button[data-color="purple"]:hover:not(:disabled) { background: var(--purple-dark); }


        
        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0,0,0,0.25);
            border-top-color: rgba(0,0,0,0.65);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            font-size: 13px;
            text-align: left;
            border-radius: 10px;
            padding: 12px;
            margin-top: 6px;
            word-break: break-word;
            display: none;
            white-space: pre-line;
        }
        .status.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid rgba(248,113,113,0.3);
        }
        .status.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid rgba(74,222,128,0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Vergangene Stundenpläne</h2>

        <div class="downloads" id="downloads"></div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>

    <script>
    // Konfiguration: hier neue Downloads einfach ergänzen
    const files = [
        {
            id: '6L',
            label: '6 Last',
            color: 'green',
            url: 'https://raw.githubusercontent.com/SigmaSites/Stundenplan/refs/heads/main/pdf/6L.pdf',
            filename: 'timetable_-OeBDnCqOMs2HcWJAsjP.pdf'
        },
        {
            id: '71',
            label: '7 First',
            color: 'blue',
            url: 'https://raw.githubusercontent.com/SigmaSites/Stundenplam/refs/heads/main/pdf/71.pdf',
            filename: 'timetable_-P1QCMeAoRNLaztDyK6b.pdf'
        },
        /*{
            id: 'test',
            label: 'Test',
            color: 'orange',
            url: 'https://raw.githubusercontent.com/SigmaSites/Flugzeug/refs/heads/main/test.html',
            filename: 'Test.html'
        },*/

    ];

    const downloadsContainer = document.getElementById('downloads');
    const statusBox = document.getElementById('status');

    // Buttons dynamisch aus der Konfiguration erzeugen
    files.forEach(file => {
        const btn = document.createElement('button');
        btn.dataset.color = file.color;
        btn.dataset.fileId = file.id;
        btn.textContent = file.label;
        btn.addEventListener('click', () => handleDownload(file, btn));
        downloadsContainer.appendChild(btn);
    });

    function setStatus(type, message) {
        statusBox.className = 'status ' + type;
        statusBox.textContent = message;
        statusBox.style.display = 'block';
    }

    function clearStatus() {
        statusBox.style.display = 'none';
        statusBox.textContent = '';
    }

    function setButtonLoading(btn, isLoading, originalLabel) {
        btn.disabled = isLoading;
        if (isLoading) {
            btn.innerHTML = '';
            const spinner = document.createElement('span');
            spinner.className = 'spinner';
            const text = document.createElement('span');
            text.textContent = 'Wird geladen …';
            btn.appendChild(spinner);
            btn.appendChild(text);
        } else {
            btn.textContent = originalLabel;
        }
    }

    async function handleDownload(file, btn) {
        clearStatus();
        setButtonLoading(btn, true, file.label);

        // Timeout, falls die Verbindung hängen bleibt
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        try {
            const response = await fetch(file.url, {
                cache: 'no-store',
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error('GitHub-Status ' + response.status + ' – Datei nicht gefunden oder nicht erreichbar.');
            }

            // Als Blob übernehmen (erhält Zeichenkodierung exakt, kein Text-Umweg nötig)
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = file.filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(objectUrl);

            setStatus('success', '„' + file.filename + '" wurde heruntergeladen.');

        } catch (error) {
            clearTimeout(timeoutId);
            let detail = error.message;
            let hint = '';

            if (error.name === 'AbortError') {
                detail = 'Zeitüberschreitung – die Datei hat zu lange zum Laden gebraucht.';
                hint = 'Prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.';
            } else if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                hint = 'Das deutet meist auf ein CORS-Problem hin: Laden Sie diese Seite von einem echten Webserver (z. B. GitHub Pages), statt sie lokal als Datei zu öffnen.';
            }

            setStatus('error', 'Fehler: ' + detail + (hint ? '\n\n' + hint : ''));
        } finally {
            setButtonLoading(btn, false, file.label);
        }
    }
    </script>
</body>
</html>
