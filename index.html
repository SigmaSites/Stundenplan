<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <title>Stundenplan → Excel</title>
        <style>
            :root {
                --bg: #F4F1EA;
                --ink: #1F1D1A;
                --muted: #6E6A61;
                --accent: #2F5D50;
                --accent-light: #DCE9E4;
                --line: #D9D4C7;
                --white: #FFFFFF;
            }

            * {
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI",Arial,sans-serif;
                background: var(--bg);
                color: var(--ink);
                margin: 0;
                padding: 40px 20px;
                display: flex;
                justify-content: center;
            }

            .card {
                width: 100%;
                max-width: 760px;
                background: var(--white);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 32px 36px;
                box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            }

            h1 {
                font-size: 22px;
                font-weight: 600;
                margin: 0 0 24px;
            }

            .notice {
                font-size: 15px;
                color: var(--ink);
                background: var(--accent-light);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 20px 22px;
                line-height: 1.6;
            }

            .notice a {
                color: var(--accent);
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Stundenplan → Excel</h1>
            <div class="notice">
                Der Konverter geht nicht mehr, <a href="https://claude.ai/public/artifacts/1cf98094-f853-4317-9d87-915487bdf0aa" target="_blank" rel="noopener">hier</a> die neue Version
            </div>
        </div>
    </body>
</html>
