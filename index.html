<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stundenplan → Excel-Version</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#F4F1EA; --ink:#1F1D1A; --muted:#6E6A61;
    --accent:#2F5D50; --accent-light:#DCE9E4; --line:#D9D4C7; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink);
    margin:0; padding:40px 20px; display:flex; justify-content:center;
  }
  .card{
    width:100%; max-width:760px; background:var(--white); border:1px solid var(--line);
    border-radius:14px; padding:32px 36px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  h1{ font-size:22px; font-weight:600; margin:0 0 24px; }

  /* Step indicator */
  .steps{ display:flex; align-items:center; margin-bottom:32px; }
  .step{ display:flex; align-items:center; gap:10px; }
  .step .dot{
    width:28px; height:28px; border-radius:50%; background:var(--line); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    flex-shrink:0; transition:background .15s;
  }
  .step.active .dot{ background:var(--accent); }
  .step.done .dot{ background:var(--accent); }
  .step .label{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .step.active .label{ color:var(--ink); font-weight:600; }
  .steps .connector{ flex:1; height:2px; background:var(--line); margin:0 12px; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .dropzone{
    border:2px dashed var(--line); border-radius:10px; padding:32px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--accent); background:var(--accent-light); }
  .dropzone span{ display:block; color:var(--muted); font-size:14px; margin-top:6px; }
  input[type=file]{ display:none; }
  #preview{ max-width:100%; max-height:240px; border-radius:8px; margin-top:18px; display:none; }

  .namerow{ display:flex; align-items:center; gap:10px; margin-top:18px; }
  .namerow label{ font-size:14px; color:var(--muted); white-space:nowrap; }
  .namerow input[type=text]{
    flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; color:var(--ink);
  }
  .namerow input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .namerow select{
    padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; color:var(--ink); background:var(--white);
  }

  button{
    background:var(--accent); color:#fff; border:none; padding:11px 20px; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; margin-top:22px; margin-right:10px;
  }
  button:disabled{ background:#B7B2A4; cursor:not-allowed; }
  button.secondary{ background:var(--white); color:var(--accent); border:1px solid var(--accent); }
  #status{ font-size:13px; color:var(--muted); margin-top:12px; min-height:18px; }

  table{ border-collapse:collapse; width:100%; margin-top:20px; font-size:13px; }
  th,td{ border:1px solid var(--line); padding:8px 10px; text-align:center; }
  th{ background:var(--accent-light); font-weight:600; }
  td.empty{ color:var(--muted); }

  .mapTable{ width:100%; border-collapse:collapse; margin-top:8px; }
  .mapTable th{ text-align:left; font-size:12px; color:var(--muted); background:none; border:none; padding:4px 6px; font-weight:600; }
  .mapTable td{ border:none; border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; }
  .mapTable input[type=text]{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:inherit;
  }
  .mapTable input[type=color]{ width:40px; height:32px; border:1px solid var(--line); border-radius:6px; padding:2px; cursor:pointer; }
  .mapTable .orig{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Stundenplan → Excel</h1>

  <div class="steps">
    <div class="step active" data-step="1"><div class="dot">1</div><div class="label">Hochladen</div></div>
    <div class="connector"></div>
    <div class="step" data-step="2"><div class="dot">2</div><div class="label">Farben &amp; Abkürzungen</div></div>
    <div class="connector"></div>
    <div class="step" data-step="3"><div class="dot">3</div><div class="label">Herunterladen</div></div>
  </div>

  <!-- Step 1 -->
  <div class="panel active" id="panel1">
    <div class="dropzone" id="dropzone">
      <div id="dz-label">Bild hierher ziehen oder klicken zum Auswählen</div>
      <span>PNG, JPG oder WEBP</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="preview">

    <div class="namerow">
      <label for="fieldSelect">In den Zellen soll stehen:</label>
      <select id="fieldSelect">
        <option value="subject" selected>Fach</option>
        <option value="teacher">Lehrer</option>
        <option value="room">Raum</option>
      </select>
    </div>

    <button id="analyzeBtn" disabled>Weiter — Bild analysieren</button>
    <div id="status1" class="statusline" style="font-size:13px; color:var(--muted); margin-top:10px; min-height:18px;"></div>
  </div>

  <!-- Step 2 -->
  <div class="panel" id="panel2">
    <p style="font-size:14px; color:var(--muted); margin-top:0;">Erkannte Werte — Anzeigename und Farbe pro Wert anpassen:</p>
    <table class="mapTable" id="mapTable">
      <thead><tr><th>Erkannt</th><th>Anzeige-Name</th><th>Farbe</th></tr></thead>
      <tbody id="mapTableBody"></tbody>
    </table>
    <div>
      <button id="backTo1Btn" class="secondary">Zurück</button>
      <button id="toStep3Btn">Weiter zur Vorschau</button>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="panel" id="panel3">
    <div id="tableWrap"></div>
    <div class="namerow">
      <label for="nameInput">Dateiname:</label>
      <input type="text" id="nameInput" placeholder="z.B. Lena Müller" value="Stundenplan">
    </div>
    <div>
      <button id="backTo2Btn" class="secondary">Zurück</button>
      <button id="downloadBtn">Als Excel-Datei herunterladen</button>
    </div>
    <div id="status3" style="font-size:13px; color:var(--muted); margin-top:10px; min-height:18px;"></div>
  </div>

</div>

let base64Data = null, mediaType = null;
let parsedData = null;
let valueMap = {}; // originalValue -> { label, color }

const steps = document.querySelectorAll('.step');
const panels = { 1: document.getElementById('panel1'), 2: document.getElementById('panel2'), 3: document.getElementById('panel3') };

function goToStep(n){
  Object.keys(panels).forEach(k => panels[k].classList.toggle('active', Number(k) === n));
  steps.forEach(s => {
    const sn = Number(s.dataset.step);
    s.classList.toggle('active', sn === n);
    s.classList.toggle('done', sn < n);
  });
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const analyzeBtn = document.getElementById('analyzeBtn');
const status1 = document.getElementById('status1');
const status3 = document.getElementById('status3');
const tableWrap = document.getElementById('tableWrap');
const downloadBtn = document.getElementById('downloadBtn');
const mapTableBody = document.getElementById('mapTableBody');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file){
  mediaType = file.type || 'image/png';
  const reader = new FileReader();
  reader.onload = () => {
    base64Data = reader.result.split(',')[1];
    preview.src = reader.result;
    preview.style.display = 'block';
    analyzeBtn.disabled = false;
    status1.textContent = '';
  };
  reader.readAsDataURL(file);
}

// Feste Standardfarben passend zu deinem Template
const KNOWN_COLORS = {
  'Mu': null, 'Musik': null,
  'Kochen': '#FF9900',
  'Geo': '#996633', 'Geographie': '#996633', 'Erdkunde': '#996633',
  'D': '#FF0000', 'Deutsch': '#FF0000',
  'Sport': '#FFC000',
  'Reli': '#7030A0', 'Religion': '#7030A0',
  'PH': '#D9D9D9', 'Physik': '#D9D9D9',
  'E': null, 'Englisch': null,
  'Geschichte': '#FF3399',
  'M': '#0070C0', 'Mathe': '#0070C0', 'Mathematik': '#0070C0',
  'BIO': '#00B050', 'Bio': '#00B050', 'Biologie': '#00B050',
  'IT': '#FFFF00', 'Informatik': '#FFFF00',
  'Kunst': '#00B0F0'
};
const PALETTE = ['#B7DEE8','#D9E1F2','#E2EFDA','#FCE4D6','#EDEDED','#FFF2CC','#D5A6BD','#C9C9FF'];

analyzeBtn.addEventListener('click', async () => {
  analyzeBtn.disabled = true;
  status1.textContent = 'Bild wird analysiert …';

  const fieldChoice = document.getElementById('fieldSelect').value; // subject | teacher | room
  const fieldLabelDe = { subject: 'das Unterrichtsfach', teacher: 'der Lehrername', room: 'die Raumnummer' }[fieldChoice];
  const fieldExampleDe = { subject: '"Mathe"', teacher: '"Frau Schmidt"', room: '"R204"' }[fieldChoice];

  const prompt = `Auf diesem Bild ist ein Stundenplan mit Fach, Lehrer und Raum je Zelle.
Gib AUSSCHLIESSLICH ein JSON-Objekt zurück, kein Fließtext, keine Markdown-Codeblöcke.
Format exakt:
{"days": ["Montag","Dienstag",...], "periods": ["1.","2.",...], "cells": [{"day":"Montag","period":"1.","value":"..."}, ...]}
- "days" nur die Wochentage, die im Plan tatsächlich vorkommen, in Reihenfolge.
- "periods" nur die Stunden/Zeitslots, die im Plan tatsächlich vorkommen, in Reihenfolge.
- "value" ist NUR ${fieldLabelDe} (z.B. ${fieldExampleDe}), nichts anderes aus der Zelle.
- Ist eine Zelle leer/frei oder enthält den gewünschten Wert nicht, lasse sie in "cells" einfach weg.
- Übernimm die Schreibweise/Abkürzung genau so, wie sie im Plan steht (nicht selbst ausschreiben — das kann im nächsten Schritt manuell angepasst werden).`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if (!textBlock) throw new Error('Keine Textantwort erhalten.');
    let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    parsedData = JSON.parse(clean);
    buildValueMap(parsedData);
    renderMapTable();
    status1.textContent = '';
    goToStep(2);
  } catch(err){
    console.error(err);
    status1.textContent = 'Fehler beim Auslesen: ' + err.message + '. Bitte erneut versuchen oder ein schärferes Bild nutzen.';
  } finally {
    analyzeBtn.disabled = false;
  }
});

function buildValueMap(data){
  const uniqueValues = [...new Set(data.cells.map(c => c.value).filter(Boolean))];
  let paletteIdx = 0;
  valueMap = {};
  uniqueValues.forEach(v => {
    let color;
    if (Object.prototype.hasOwnProperty.call(KNOWN_COLORS, v)) {
      color = KNOWN_COLORS[v] || '#FFFFFF';
    } else {
      color = PALETTE[paletteIdx % PALETTE.length]; paletteIdx++;
    }
    valueMap[v] = { label: v, color: color };
  });
}

function renderMapTable(){
  mapTableBody.innerHTML = '';
  Object.keys(valueMap).forEach(orig => {
    const entry = valueMap[orig];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="orig">${escapeHtml(orig)}</td>
      <td><input type="text" data-orig="${escapeAttr(orig)}" class="labelInput" value="${escapeAttr(entry.label)}"></td>
      <td><input type="color" data-orig="${escapeAttr(orig)}" class="colorInput" value="${entry.color}"></td>
    `;
    mapTableBody.appendChild(tr);
  });
  mapTableBody.querySelectorAll('.labelInput').forEach(inp => {
    inp.addEventListener('input', () => { valueMap[inp.dataset.orig].label = inp.value; });
  });
  mapTableBody.querySelectorAll('.colorInput').forEach(inp => {
    inp.addEventListener('input', () => { valueMap[inp.dataset.orig].color = inp.value; });
  });
}

document.getElementById('backTo1Btn').addEventListener('click', () => goToStep(1));

document.getElementById('toStep3Btn').addEventListener('click', () => {
  renderPreviewTable();
  goToStep(3);
});
document.getElementById('backTo2Btn').addEventListener('click', () => goToStep(2));

function renderPreviewTable(){
  const { days, periods, cells } = parsedData;
  const lookup = {};
  cells.forEach(c => { lookup[c.day + '|' + c.period] = c.value; });

  let html = '<table><thead><tr><th>Stunde</th>';
  days.forEach(d => html += `<th>${escapeHtml(d)}</th>`);
  html += '</tr></thead><tbody>';
  periods.forEach(p => {
    html += `<tr><th>${escapeHtml(p)}</th>`;
    days.forEach(d => {
      const raw = lookup[d + '|' + p];
      const entry = raw ? valueMap[raw] : null;
      if (entry){
        html += `<td style="background:${entry.color}22;">${escapeHtml(entry.label)}</td>`;
      } else {
        html += `<td class="empty">–</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  tableWrap.innerHTML = html;
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;'); }

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function hexToArgb(hex){
  const h = hex.replace('#', '').toUpperCase();
  return 'FF' + h;
}

async function buildWorkbookBlob(days, periods, lookup){
  const buffer = base64ToArrayBuffer(TEMPLATE_B64);
  const workbook = new ExcelJS.Workbook();
  await workbook.xlsx.load(buffer);
  const ws = workbook.getWorksheet('Stundenplan');

  const dayCols = ['C','D','E','F','G'];
  const canonicalDays = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
  // Pause liegt nach Stunde 2 und nach Stunde 4 (Zeilen 6 und 9 bleiben unberührt).
  // Dienstag hat nach Stunde 2 zusätzlich die KLS-Stunde, erst danach die Pause.
  const fallbackRows = [3,4,7,8,10,11];
  const lessonRowsByDay = {
    'Montag': [3,4,7,8,10,11],
    'Dienstag': [3,4,5,7,8,10,11],
    'Mittwoch': [3,4,7,8,10,11],
    'Donnerstag': [3,4,7,8,10,11],
    'Freitag': [3,4,7,8,10,11]
  };

  let orderedDays = days.every(d => canonicalDays.includes(d))
    ? canonicalDays.filter(d => days.includes(d))
    : days.slice();
  orderedDays = orderedDays.slice(0, 5);

  orderedDays.forEach((day, cIdx) => {
    const col = dayCols[cIdx];
    const rows = lessonRowsByDay[day] || fallbackRows;

    // Zielzeilen für diesen Tag erst leeren, damit keine alten Beispielwerte stehen bleiben.
    rows.forEach(row => {
      const cell = ws.getCell(col + row);
      cell.value = '';
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFFFF' } };
    });

    // Erkannte Werte der Reihe nach in die verfügbaren Zeilen dieses Tages eintragen.
    // Perioden, die für diesen Tag nicht vorkommen (z.B. KLS an anderen Tagen als Dienstag),
    // werden übersprungen, ohne eine Zeile zu verbrauchen.
    let rowIdx = 0;
    periods.forEach(period => {
      if (rowIdx >= rows.length) return;
      const raw = lookup[day + '|' + period];
      if (raw === undefined) return;
      const row = rows[rowIdx];
      rowIdx++;
      const entry = valueMap[raw];
      const cell = ws.getCell(col + row);
      cell.value = entry ? entry.label : raw;
      cell.fill = {
        type: 'pattern', pattern: 'solid',
        fgColor: { argb: entry ? hexToArgb(entry.color) : 'FFFFFFFF' }
      };
    });
  });

  const outBuffer = await workbook.xlsx.writeBuffer();
  return new Blob([outBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

downloadBtn.addEventListener('click', async () => {
  if (!parsedData) return;
  const { days, periods, cells } = parsedData;
  const lookup = {};
  cells.forEach(c => { lookup[c.day + '|' + c.period] = c.value; });

  const rawName = document.getElementById('nameInput').value.trim() || 'Stundenplan';
  const fileSafeName = rawName.replace(/[\\\/\?\*\[\]:"<>|]/g, '_');

  downloadBtn.disabled = true;
  status3.textContent = 'Excel-Datei wird erstellt …';
  try{
    const blob = await buildWorkbookBlob(days, periods, lookup);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${fileSafeName}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    status3.textContent = 'Fertig — Excel-Datei heruntergeladen.';
  } catch(err){
    console.error(err);
    status3.textContent = 'Fehler beim Erstellen der Excel-Datei: ' + err.message;
  } finally {
    downloadBtn.disabled = false;
  }
});
